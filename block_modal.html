<div data-properties-surface="modal" class="modal-panel cw-zcode-modal" role="dialog" aria-modal="true" aria-labelledby="zcode-modal-title" data-generic-block-modal-root data-block-runtime-refresh="autonomous" data-node-id="{{ node_id }}" data-node-kind="zcode">
  <header class="modal-header">
    <div><span class="panel-kicker">Zcode</span><h2 id="zcode-modal-title">{{ node_title }}</h2></div>
    <button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.close">Close</button>
  </header>
  <div class="zcode-modal-body">
    <nav class="zcode-modal-tablist" role="tablist" aria-label="Zcode">{{ tabs }}</nav>
    <div class="zcode-modal-panels">{{ panels }}</div>
  </div>
  <footer class="zcode-modal-footer">
    <span class="field-hint" data-i18n="block.zcode.apply_hint">The directory-port switch applies immediately. Apply saves the other settings.</span>
    <div class="modal-actions"><button class="ghost-btn" data-close-block-modal type="button" data-i18n="ui.block_kit.cancel">Cancel</button><button class="solid-btn" data-block-apply type="button" disabled data-i18n="ui.block_kit.apply">Apply</button></div>
  </footer>
</div>
